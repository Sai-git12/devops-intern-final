services:
  mariadb:
    image: mariadb:10.11
    container_name: portability-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: portability_test
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpass
    ports:
      - "3307:3306"

  mysql:
    image: mysql:8.0
    container_name: portability-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: portability_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3308:3306"

  percona:
    image: percona:8.0
    container_name: portability-percona
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: portability_test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3309:3306"