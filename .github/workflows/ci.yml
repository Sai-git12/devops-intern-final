name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hello.py
        run: python hello.py

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Check logs for unmasked PII
        run: |
          python hello.py > output.log 2>&1
          if grep -Eiq '[0-9]{3}-[0-9]{2}-[0-9]{4}|[0-9]{10}' output.log; then
            echo "ERROR: Possible unmasked PII detected in logs!"
            cat output.log
            exit 1
          fi
          echo "No unmasked PII detected."
